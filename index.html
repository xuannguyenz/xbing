<title>Multi Apple Viewer</title>
<style>
{
    box-sizing:border-box;
}
body{
    margin:0;
    padding:15px;
    background:#1b1b1b;
    display:flex;
    flex-direction: row;
    gap:15px;
    justify-content:flex-start;
    align-items:center;
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
}
/* Sidebar Controls */
.sidebar{
    display:flex;
    flex-direction:column;
    gap:10px;
    flex-shrink:0;
    width:auto;
}
button{
    padding:10px 15px;
    background:#ff9800;
    color:#000;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
    transition:background 0.3s;
    white-space:nowrap;
}
button:hover{
    background:#ffb74d;
}
button:active{
    background:#fb8c00;
}
/* Frames Container */
.frames-container{
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:center;
    flex:1;
    width:100%;
    height:100%;
    min-height:0;
}
/* iPad Pro (12.9") - Aspect Ratio 16:10 */
.desktop-wrapper{
    width:1280px;
    height:800px;
    background:#3a2a2a;
    border-radius:20px;
    padding:10px;
    box-shadow:
        0 0 20px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    min-height:0;
    aspect-ratio: 16/10;
}
.desktop-title{
    color:#fff;
    padding:8px;
    font-size:14px;
    flex-shrink:0;
}
#desktopFrame{
    width:1280px;
    height:800px;
    border:none;
    border-radius:14px;
    background:#fff;
    flex:1;
    min-height:0;
}
/* iPhone Pro (Max) - Aspect Ratio 19.5:9 */
.mobile-wrapper{
    width:369px;
    height:800px;
    background:#3a2a2a;
    border-radius:40px;
    padding:12px;
    position:relative;
    box-shadow:
        0 0 20px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    min-height:0;
    aspect-ratio: 19.5/9;
    flex-shrink:0;
}
.mobile-title{
    color:#fff;
    padding:8px;
    font-size:14px;
    flex-shrink:0;
}
.mobile-notch{
    width:100px;
    height:20px;
    background:#000;
    border-radius:20px;
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
}
#mobileFrame{
    width:369px;
    height:800px;
    border:none;
    border-radius:30px;
    background:#fff;
    flex:1;
    min-height:0;
}
</style>
</head>
<body>
<!-- Sidebar Controls -->
<div class="sidebar">
    <button onclick="loadBoth()">Load</button>
    <button onclick="clearFrames()">Clear</button>
</div>
<!-- Frames Container -->
<div class="frames-container">
    <!-- iPad Pro -->
    <div class="desktop-wrapper">
        <div class="desktop-title">iPad Pro</div>
        <iframe id="desktopFrame"></iframe>
    </div>
    <!-- iPhone Pro -->
    <div class="mobile-wrapper">
        <div class="mobile-title">iPhone Pro</div>
        <div class="mobile-notch"></div>
        <iframe id="mobileFrame"></iframe>
    </div>
</div>

/* =========================
   URL Builder
========================= */
function createDesktopUrl(){
    return "https://www.bing.com/search"
        + "?q=" + encodeURIComponent(randomQuery())
        + "&form=QBLH"
        + "&mkt=en-US";
}
function createMobileUrl(){
    return "https://rewards.bing.com/earn";
}
/* =========================
   Load Desktop Search
========================= */
function loadDesktopSearch(){
    const frame = document.getElementById("desktopFrame");
    frame.src = createDesktopUrl();
}
/* =========================
   Load Mobile Rewards
========================= */
function loadMobileRewards(){
    const frame = document.getElementById("mobileFrame");
    frame.src = createMobileUrl();
}
/* =========================
   Load Both
========================= */
function loadBoth(){
    loadDesktopSearch();
    loadMobileRewards();
}
/* =========================
   Clear Frames
========================= */
function clearFrames(){
    document.getElementById("desktopFrame").src = "";
    document.getElementById("mobileFrame").src = "";
}
