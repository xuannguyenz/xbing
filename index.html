<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    padding:15px;
    background:#0f0f0f;
    display:flex;
    flex-direction: row;
    gap:15px;
    justify-content:flex-start;
    align-items:center;
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
}

/* Mobile responsive */
@media (max-width: 768px) {
    body {
        flex-direction: column;
        padding: 10px;
        gap: 10px;
        height: auto;
        overflow-y: auto;
    }
    .sidebar {
        flex-direction: row !important;
        width: 100%;
        justify-content: center;
    }
    .frames-container {
        flex-direction: column !important;
        gap: 10px !important;
    }
    .desktop-wrapper, .mobile-wrapper {
        width: 100% !important;
        height: auto !important;
        max-height: 50vh;
    }
    #desktopFrame, #mobileFrame {
        height: 400px !important;
        width: 100% !important;
    }
}

/* Sidebar Controls */
.sidebar{
    display:flex;
    flex-direction:column;
    gap:10px;
    flex-shrink:0;
    width:auto;
}
button{
    padding:12px 20px;
    background:linear-gradient(135deg, #ff9800, #ffb74d);
    color:#000;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    transition:all 0.3s;
    white-space:nowrap;
    box-shadow: 0 2px 8px rgba(255,152,0,0.3);
}
button:hover{
    background:linear-gradient(135deg, #ffb74d, #ffc947);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255,152,0,0.4);
}
button:active{
    background:linear-gradient(135deg, #fb8c00, #ff9800);
    transform: translateY(0);
}

/* Frames Container */
.frames-container{
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:center;
    flex:1;
    width:100%;
    height:100%;
    min-height:0;
}

/* iPad Pro (12.9") - Aspect Ratio 16:10 */
.desktop-wrapper{
    width:1280px;
    height:800px;
    background:linear-gradient(135deg, #2a2a2a, #3a3a3a);
    border-radius:20px;
    padding:12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    min-height:0;
    aspect-ratio: 16/10;
    border: 1px solid rgba(255,255,255,0.1);
}
.desktop-title{
    color:#fff;
    padding:8px 12px;
    font-size:13px;
    flex-shrink:0;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
}
#desktopFrame{
    width:100%;
    height:100%;
    border:none;
    border-radius:14px;
    background:#fff;
    flex:1;
    min-height:0;
}

/* iPhone X - Aspect Ratio 19.5:9 */
.mobile-wrapper{
    width:369px;
    height:800px;
    background:linear-gradient(135deg, #1a1a1a, #2a2a2a);
    border-radius:45px;
    padding:14px;
    position:relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    min-height:0;
    aspect-ratio: 19.5/9;
    flex-shrink:0;
    border: 1px solid rgba(255,255,255,0.1);
}

.mobile-title{
    color:#fff;
    padding:8px 12px;
    font-size:13px;
    flex-shrink:0;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
}

/* iPhone X Notch */
.mobile-notch{
    width:120px;
    height:25px;
    background:#000;
    border-radius:0 0 25px 25px;
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    box-shadow: 0 4px 8px rgba(0,0,0,0.8);
}

#mobileFrame{
    width:100%;
    height:100%;
    border:none;
    border-radius:32px;
    background:#fff;
    flex:1;
    min-height:0;
    margin-top: 5px;
}

/* iPhone X specific - safe area spacing */
@media (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) {
    body {
        padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px);
    }
}
</style>

function createMobileUrl(){
